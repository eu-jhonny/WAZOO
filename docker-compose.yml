version: "3.9"

services:
  # ── Banco de dados PostgreSQL ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: wazoo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wazoo
      POSTGRES_PASSWORD: wazoopass123
      POSTGRES_DB: wazoo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wazoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Backend ───────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wazoo_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://wazoo:wazoopass123@postgres:5432/wazoo
      JWT_SECRET: ${JWT_SECRET:-mude_esta_chave_em_producao_32chars}
      REFRESH_SECRET: ${REFRESH_SECRET:-outra_chave_refresh_32chars_aqui}
      JWT_EXPIRES_IN: 7d
      REFRESH_EXPIRES_IN: 30d
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wazoo.com.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-WazooAdmin2024!}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      API_URL: ${API_URL:-http://localhost:3001}
    ports:
      - "3001:3001"

  # ── Frontend (produção) ───────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: wazoo_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
