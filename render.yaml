# Render.com — Blueprint completo: Frontend + Backend + Banco
# ─────────────────────────────────────────────────────────────
# Como usar:
#   1. render.com → "New +" → "Blueprint"
#   2. Conecte o repositório GitHub
#   3. Render cria os 3 serviços abaixo automaticamente
# ─────────────────────────────────────────────────────────────

services:

  # ── 1. FRONTEND (Static Site — grátis sempre) ─────────────
  - type: web
    name: wazoo-frontend
    env: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: wazoo-api
          type: web
          property: host
          # Render preenche automaticamente com a URL do backend
      - key: VITE_MP_PUBLIC_KEY
        sync: false   # ← você preenche no painel do Render
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # ── 2. BACKEND API (Web Service — 750h/mês grátis) ────────
  - type: web
    name: wazoo-api
    env: node
    rootDir: server
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wazoo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REFRESH_EXPIRES_IN
        value: 30d
      - key: ALLOWED_ORIGINS
        sync: false   # ex: https://wazoo-frontend.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false   # ex: admin@wazoo.com.br
      - key: ADMIN_PASSWORD
        sync: false   # ex: SenhaForte2025!
      - key: MP_ACCESS_TOKEN
        sync: false   # do painel MercadoPago
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false   # opcional — para upload de imagens
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

# ── 3. BANCO PostgreSQL (grátis 90 dias, depois pago) ────────
databases:
  - name: wazoo-db
    databaseName: wazoo
    user: wazoo
    plan: free
