# Render.com — Static Site (frontend Vite + React)
# ─────────────────────────────────────────────────────────────────
# Como usar:
#   1. Crie conta em https://render.com (grátis)
#   2. Clique "New +" → "Static Site"
#   3. Conecte seu repositório GitHub
#   4. Render detecta este arquivo automaticamente
#
# Ou, preencha manualmente no painel do Render:
#   Build Command : npm ci && npm run build
#   Publish Dir   : dist
# ─────────────────────────────────────────────────────────────────

services:
  - type: web
    name: wazoo-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    # SPA: redireciona todas as rotas para index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Cache longo para assets versionados pelo Vite
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400
